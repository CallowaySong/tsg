<html lang="en">

    <title>On March 7th.</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        background: #000;
        color: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        align-items: center;
        padding: clamp(24px, 5vw, 80px);
      }

      main {
        width: 100%;
        min-width: 0;
        max-width: 1600px;
        margin-inline: auto;
      }

      h1 {
        margin: 0;
        font-family: Impact, Anton, "Arial Black", sans-serif;
        font-size: clamp(3.5rem, 11.5vw, 12rem);
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.025em;
        text-transform: uppercase;
        overflow-wrap: anywhere;
      }

      .line {
        display: block;
      }

      ::selection {
        color: #000;
        background: #fff;
      }

      @media print {
        :root {
          background: #fff;
          color: #000;
        }

        body {
          min-height: auto;
        }
      }
    </style>
  </head>

      <h1>
        <span class="line">On March 7th,</span>
